[project]
name = "cronet"
version = "0.3.0"
description = "Chrome's network stack as a Python library — Cronet over ctypes."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "luanon404", email = "luanon404@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]

# hatchling rather than uv_build: the package ships a compiled libcronet.so, and
# uv's backend builds pure-Python wheels only, so it can describe this one only
# as `py3-none-any` — a wheel that installs on macOS and Windows and then fails
# at the first import. The tag is set in hatch_build.py.
[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cronet"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "native", "patches", "scripts", "tests", "README.md", "LICENSE"]

[tool.ruff.lint]
# The default rule set is small enough that a green run says little. These are
# the checks this codebase is actually written to: pycodestyle, pyflakes,
# import order, modern-Python upgrades, bugbear, simplify, comprehensions, and
# the ruff-native rules.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: needs the internet; skipped when it is unreachable",
]

[dependency-groups]
dev = [
    "hatchling>=1.31.0",
    "msgspec>=0.21.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]
